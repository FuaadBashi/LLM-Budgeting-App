[project]
name = "personal-finance-os-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
#: Only needed to actually call Claude. Without it, and without an API key,
#: every suggestion path is a no-op (A3).
llm = ["anthropic>=0.40"]

[tool.setuptools]
# Named explicitly. Flat-layout auto-discovery treats every top-level directory
# as a package, so the backups/ directory the scheduler creates broke editable
# installs the moment it first appeared.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
